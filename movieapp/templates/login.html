{% include "base.html" %}



{% block content %}
<style> 
    /* Card */
.card {
  background: #16161c;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 2rem;
  max-width: 420px;
  margin: 4rem auto;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  color: #e8b86d;
  margin-bottom: 1.5rem;
}

/* Labels */
.form-label {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 6px;
}

/* Inputs */
.form-control {
  background: #0c0c0f !important;
  border: 1px solid rgba(255,255,255,0.08) !important;
  border-radius: 8px !important;
  color: #f0f0f0 !important;
  font-size: 14px;
  padding: 10px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-control:focus {
  border-color: #e8b86d !important;
  box-shadow: 0 0 0 3px rgba(232,184,109,0.1) !important;
}

.form-control::placeholder { color: rgba(255,255,255,0.2) !important; }

/* Helper text */
.form-text { font-size: 11px; color: rgba(255,255,255,0.25); }

/* Button */
.btn-primary {
  background: #e8b86d !important;
  border: none !important;
  color: #000 !important;
  font-weight: 600;
  font-size: 13px;
  padding: 10px 24px;
  border-radius: 50px;
  transition: opacity 0.2s, transform 0.15s;
}

.btn-primary:hover  { opacity: 0.85 !important; transform: translateY(-1px); }
.btn-primary:active { transform: scale(0.97); }
</style>
    <br>
    <div class="container">
        <div class="jumbotron">
            <div class="card card-body">
                <h1>Sign in here</h1>
                <form action="{% url 'login' %}" method="POST"  >
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" id="exampleInputUsername1">
                        <div id="emailHelp" class="form-text">We'll never share your username with anyone else.</div>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="exampleInputPassword1">
                    </div>
                   
                    <button type="submit" class="btn btn-primary">Login</button>
                    </form>

            </div>
             
             

        </div>
    </div>
    
{% endblock %}
