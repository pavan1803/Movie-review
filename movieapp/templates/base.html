 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        /* Navbar */
.navbar {
  background: rgba(12,12,15,0.85) !important;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  padding: 1rem 0;
}

.nav-link {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.5) !important;
  letter-spacing: 0.5px;
  transition: color 0.2s;
  padding: 6px 14px !important;
}

.nav-link:hover { color: #e8b86d !important; }

/* Body */
body {
  background: #0c0c0f;
  font-family: 'DM Sans', sans-serif;
  color: #f0f0f0;
  min-height: 100vh;
}

/* Block content area */
.container {
  padding-top: 2rem;
  padding-bottom: 4rem;
}
    </style>
</head>
<body> 

    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <ul class="nav navbar">
                {% if user.is_authenticated %}    <!-- use the free variable user -->
                    <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
                    {% comment %} <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">profile</a></li> {% endcomment %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Log Out</a></li>

                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
                    {% comment %} <li class="nav-item"><a class="nav-link" href="{% url 'labtechreg' %}">labtech Register</a></li> {% endcomment %}

                    <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>

                {% endif %}
               
               
                
               

                <!-- complete path : absolute url
                url tag : relative url -->
            </ul>
        </div>
    </nav>

    {% block content %}

    {% endblock %}
